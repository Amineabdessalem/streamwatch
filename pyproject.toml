[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwatch"
version = "0.1.0"
description = "Streaming time-series anomaly detection: z-score, EWMA and isolation forest, one point at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
streamwatch = "streamwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
